<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Sistema CNA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo-bar {
            background: #1f3c88;
            color: white;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1f3c88;
            box-shadow: 0 0 0 2px rgba(31,60,136,0.15);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #162d6a;
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-bar">🏦 Sistema CNA</div>
            <p>Negociação de Dívidas — Acesso Restrito</p>
        </div>

        {% if form.errors %}
        <div class="error-msg">
            ⚠️ Usuário ou senha incorretos. Tente novamente.
        </div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
            <div class="error-msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="id_username">Usuário</label>
                <input type="text" id="id_username" name="username"
                       autofocus autocomplete="username"
                       placeholder="Digite seu usuário">
            </div>

            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" id="id_password" name="password"
                       autocomplete="current-password"
                       placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <p class="footer-note">CNA Vivendas &amp; Itanhangá © 2025</p>
    </div>
</body>
</html>
