<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema CNA{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1f3c88;
            --primary-light: #eef2ff;
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* --- TOPBAR --- */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .topbar-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-info {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .user-info strong {
            color: var(--text-main);
        }

        .btn-logout {
            background: #f1f5f9;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8125rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #e2e8f0;
        }

        /* --- NAVIGATION --- */
        .nav-links {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 1.5rem;
        }

        .nav-item {
            padding: 1rem 0;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-item:hover {
            color: var(--primary);
        }

        .nav-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* --- CONTENT --- */
        .main-content {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .card-base {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            padding: 1.5rem;
        }

        /* --- COMMON UTILS --- */
        h1, h2, h3 {
            margin: 0;
            font-weight: 600;
            color: var(--text-main);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background: #f8fafc;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: opacity 0.2s;
        }

        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary {
            background: white;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-secondary:hover { background: #f8fafc; }

        /* Responsive */
        @media (max-width: 768px) {
            .topbar { padding: 0 1rem; }
            .nav-links { overflow-x: auto; padding: 0 1rem; }
            .main-content { padding: 1rem; margin: 1rem auto; }
            .nav-container { gap: 1rem; }
            .user-info span { display: none; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <header class="topbar">
        <div class="topbar-container">
            <a href="/" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                CNA Finanças
            </a>
            
            {% if user.is_authenticated %}
            <div class="user-nav">
                <div class="user-info">
                    <span>Operador:</span> <strong>{{ user.username }}</strong>
                </div>
                <form method="post" action="/logout/" style="margin:0;">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">Sair</button>
                </form>
            </div>
            {% endif %}
        </div>
    </header>

    <nav class="nav-links">
        <div class="nav-container">
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">Localizar Devedor</a>
            <a href="/devedores/" class="nav-item {% if '/devedores/' in request.path %}active{% endif %}">Base Geral (Completa)</a>
            <a href="/acordos/" class="nav-item {% if '/acordos/' in request.path %}active{% endif %}">Acordos</a>
            <a href="/financeiro/" class="nav-item {% if '/financeiro/' in request.path %}active{% endif %}">Financeiro</a>
            <a href="/dashboard/" class="nav-item {% if '/dashboard/' in request.path %}active{% endif %}">Dashboard</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
