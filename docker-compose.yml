cat << 'EOF' > /app/docker-compose.yml
version: '3.8'
services:
  web:
    build: .
    container_name: cna_inadimplentes
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      - DEBUG=False
      - SECURE_SSL_REDIRECT=False
      - DATABASE_URL=sqlite:////app/data/db.sqlite3
    volumes:
      - ./data:/app/data
    networks:
      - cna_network
  nginx:
    image: nginx:alpine
    container_name: cna_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    networks:
      - cna_network
networks:
  cna_network:
    driver: bridge
EOF